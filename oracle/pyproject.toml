[project]
name = "calchai-oracle"
version = "0.1.0"
description = "CalchAI Proof of Reasoning oracle: scores reasoning traces and mints $COGN on Monad"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "web3>=7.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
